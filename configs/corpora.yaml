# Map each corpus's raw columns onto the canonical schema (src/crossread/schema.py).
# Canonical keys: subject_id, text (or the keys listed in text_keys), word_idx, word,
#                 FFD, GD, TFT, [skip], [model], [decoding], [genre]
# Lines marked VERIFY are guesses: run `python run.py columns <corpus>` to print
# the real column names and fix them here.

data_root: data            # paths below are relative to this folder

corpora:

  emtec:
    path: emtec/reading_measures_corrected.csv
    sep: "\t"
    language: en
    source: machine
    zero_means_not_fixated: true
    text_keys: [text, model, decoding]
    columns:
      subject_id: subject_id
      text: item_id
      model: model
      decoding: decoding_strategy
      word_idx: word_id
      word: word
      FFD: FFD
      GD: FPRT
      TFT: TFT
      genre: task
      reg_out: FPReg

  provo:
    path: provo/Provo_Corpus-Eyetracking_Data.csv
    language: en
    source: human
    genre: mixed
    zero_means_not_fixated: true
    columns:                               # VERIFY (SR Data Viewer IA report names)
      subject_id: Participant_ID
      text: Text_ID
      word_idx: Word_Number
      word: Word
      FFD: IA_FIRST_FIXATION_DURATION
      GD: IA_FIRST_RUN_DWELL_TIME
      TFT: IA_DWELL_TIME
      skip: IA_SKIP
      reg_out: IA_REGRESSION_OUT

  meco_en:
    path: meco/meco_l1.rda
    language: en
    source: human
    genre: encyclopedic
    filter: {lang: en}
    zero_means_not_fixated: true
    columns:
      subject_id: subid
      text: trialid
      word_idx: wordnum
      word: word
      FFD: firstfix.dur
      GD: firstrun.dur
      TFT: dur
      skip: firstrun.skip
      reg_out: firstrun.reg.out

  onestop:
    path: onestop/ia_Paragraph_ordinary.csv
    language: en
    source: human
    genre: news
    filter: {practice_trial: false}
    zero_means_not_fixated: true
    text_keys: [batch, article, paragraph, level]
    item_keys: [batch, article, paragraph]
    columns:
      subject_id: participant_id
      batch: article_batch
      article: article_id
      paragraph: paragraph_id
      level: difficulty_level
      word_idx: IA_ID
      word: IA_LABEL
      FFD: IA_FIRST_FIXATION_DURATION
      GD: IA_FIRST_RUN_DWELL_TIME
      TFT: IA_DWELL_TIME
      skip: IA_SKIP
      reg_out: IA_REGRESSION_OUT

  great:
    path: great/great_words.csv
    language: en
    source: machine
    genre: chat
    zero_means_not_fixated: true
    columns: {subject_id: subject_id, text: text_id, word_idx: word_id, word: word, FFD: FFD, GD: GD, TFT: TFT, skip: skip, reg_out: reg_out, model: model}

  oasst:
    path: oasstetc/oasst_words.csv
    language: en
    source: human
    genre: chat
    zero_means_not_fixated: true
    columns: {subject_id: subject_id, text: text_id, word_idx: word_id, word: word, FFD: FFD, GD: GD, TFT: TFT, skip: skip, reg_out: reg_out}
        

  # --- later: cross-lingual generalization (needs a multilingual LM, e.g. mGPT / Qwen) ---
  # potec:   {path: ..., language: de, source: human, genre: textbook, columns: {...}}
  # copco:   {path: ..., language: da, source: human, genre: speech-manuscript, columns: {...}}

# which corpora to run (comment out ones you don't have yet)
use: [emtec, provo, meco_en, onestop, great, oasst]

lms:                     # HF model ids or local folders
  - gpt2
  - EleutherAI/pythia-160m
device: mps

analysis:
  measures: [FFD, GD, TFT, skip_rate]
  min_readers: 3          # drop words read by fewer readers (EMTeC: ~7-8 per condition)
  k_folds: 10
  n_perm: 2000
  n_boot: 1000
